name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Kalau repo punya gradlew -> pakai wrapper. Kalau tidak -> pakai Gradle 9.2.0 bawaan Actions.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ hashFiles('gradlew') != '' && 'wrapper' || '9.2.0' }}

      - name: Build jar
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: autofarm-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Create GitHub Release (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
